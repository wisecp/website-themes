  <rect width="640" height="420" fill="#eef1f5"/>
  <!-- browser window -->
  <rect x="40" y="40" width="560" height="340" rx="12" fill="#ffffff" stroke="#d7dce3"/>
  <rect x="40" y="40" width="560" height="44" rx="12" fill="#f3f5f8"/>
  <rect x="40" y="72" width="560" height="12" fill="#f3f5f8"/>
  <circle cx="64" cy="62" r="5" fill="#f87171"/>
  <circle cx="82" cy="62" r="5" fill="#fbbf24"/>
  <circle cx="100" cy="62" r="5" fill="#34d399"/>
