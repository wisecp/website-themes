<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Stylized map placeholder">
    <rect width="1000" height="600" fill="#eaeef3"/>
    <!-- water -->
    <path d="M0 430 C 180 380 320 470 520 440 C 700 414 840 470 1000 440 L1000 600 L0 600 Z" fill="#cfe0ec"/>
    <!-- park -->
    <rect x="120" y="90" width="240" height="170" rx="18" fill="#d9e8d1"/>
    <rect x="640" y="300" width="210" height="150" rx="18" fill="#d9e8d1"/>
    <!-- blocks -->
    <g fill="#dfe4ec">
        <rect x="430" y="70" width="120" height="90" rx="8"/>
        <rect x="580" y="70" width="150" height="90" rx="8"/>
        <rect x="760" y="70" width="120" height="120" rx="8"/>
        <rect x="430" y="200" width="120" height="120" rx="8"/>
        <rect x="120" y="300" width="150" height="110" rx="8"/>
        <rect x="300" y="300" width="130" height="110" rx="8"/>
    </g>
    <!-- roads -->
    <g stroke="#ffffff" stroke-linecap="round" fill="none">
        <path d="M0 180 H1000" stroke-width="22"/>
        <path d="M0 285 H1000" stroke-width="16"/>
        <path d="M400 0 V600" stroke-width="22"/>
        <path d="M560 0 V430" stroke-width="14"/>
        <path d="M740 0 V300" stroke-width="14"/>
        <path d="M100 0 V600" stroke-width="14"/>
    </g>
    <g stroke="#f4f7fa" stroke-linecap="round" fill="none">
        <path d="M0 110 H1000" stroke-width="6"/>
        <path d="M0 360 H640" stroke-width="6"/>
        <path d="M250 0 V600" stroke-width="6"/>
        <path d="M880 0 V600" stroke-width="6"/>
    </g>
    <!-- pin -->
    <g transform="translate(500 250)">
        <ellipse cx="0" cy="78" rx="34" ry="11" fill="#0b1b2b" opacity="0.14"/>
        <path d="M0 78 C -34 28 -42 6 -42 -16 A 42 42 0 1 1 42 -16 C 42 6 34 28 0 78 Z" fill="#095174"/>
        <circle cx="0" cy="-16" r="16" fill="#ffffff"/>
    </g>
</svg>
