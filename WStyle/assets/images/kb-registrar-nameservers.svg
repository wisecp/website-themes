  <text x="90" y="215" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#334155">ns1.wstyle-dns.com</text>
  <!-- NS2 field -->
  <rect x="72" y="246" width="90" height="10" rx="5" fill="#94a3b8"/>
  <rect x="72" y="266" width="496" height="40" rx="8" fill="#f5f6f8" stroke="#d7dce4" stroke-width="2"/>
  <text x="90" y="291" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#334155">ns2.wstyle-dns.com</text>
  <!-- save button -->
  <rect x="438" y="320" width="130" height="34" rx="8" fill="#095174"/>
  <rect x="470" y="333" width="66" height="9" rx="4" fill="#ffffff" opacity="0.92"/>
