<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Registrar nameserver settings panel">
  <rect width="640" height="400" fill="#eef1f5"/>
  <!-- window -->
  <rect x="40" y="36" width="560" height="328" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="2"/>
  <!-- title bar -->
  <rect x="40" y="36" width="560" height="44" rx="12" fill="#f5f6f8"/>
  <rect x="40" y="68" width="560" height="12" fill="#f5f6f8"/>
  <circle cx="64" cy="58" r="5" fill="#e2606a"/>
  <circle cx="82" cy="58" r="5" fill="#e8b75a"/>
  <circle cx="100" cy="58" r="5" fill="#5cb47e"/>
  <rect x="250" y="52" width="140" height="12" rx="6" fill="#dfe3ea"/>
  <!-- heading -->
  <rect x="72" y="108" width="180" height="16" rx="5" fill="#475569"/>
  <rect x="72" y="134" width="320" height="10" rx="5" fill="#aab4c2"/>
